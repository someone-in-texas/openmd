name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test executable, package, and installer
        run: |
          bash -n openmd install.sh
          python3 scripts/package.py "v$(./openmd --version | cut -d ' ' -f 2)"

  browser:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install browser test tools outside the project
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-package-lock playwright@1.60.0
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test preview in Chromium
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright" node tests/browser.cjs

  release:
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Package and test downloads
        run: python3 scripts/package.py "$TAG"
      - name: Publish release downloads
        run: |
          awk -v version="${TAG#v}" '$0 == "## " version {found=1;next} found && /^## / {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" dist/* --verify-tag --draft --title "openmd ${TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release download "$TAG" --dir "$RUNNER_TEMP/downloads"
          (cd "$RUNNER_TEMP/downloads" && sha256sum -c SHA256SUMS)
          chmod +x "$RUNNER_TEMP/downloads/openmd"
          test "$("$RUNNER_TEMP/downloads/openmd" --version)" = "openmd ${TAG#v}"
          gh release edit "$TAG" --draft=false --latest
      - name: Verify public download
        run: |
          curl --fail --silent --show-error --location "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/openmd" -o "$RUNNER_TEMP/public-openmd"
          cmp dist/openmd "$RUNNER_TEMP/public-openmd"
      - name: Verify public curl install
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" | OPENMD_INSTALL_DIR="$RUNNER_TEMP/installed" bash
          test "$("$RUNNER_TEMP/installed/openmd" --version)" = "openmd ${TAG#v}"
          OPENMD_NO_OPEN=1 "$RUNNER_TEMP/installed/openmd" README.md
